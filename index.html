<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061629"><link rel="manifest" href="manifest.webmanifest"><title>RUSTBOT TRADE AI</title><style>body{margin:0;background:linear-gradient(145deg,#102e50,#020611);color:white;font:16px Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(90%,420px);text-align:center;border:1px solid #168bb0;border-radius:22px;padding:24px;background:#071729}.robot{font-size:64px}h1{color:#19d5ff}p{color:#bbd3e3;line-height:1.6}button,a.button{display:block;box-sizing:border-box;width:100%;padding:15px;background:#00a9d6;color:#001420;font-weight:bold;border:0;border-radius:12px;text-decoration:none;margin:12px 0;cursor:pointer}input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;background:#10283a;border:1px solid #43869a;color:white}small{color:#9cb8ca}</style></head><body><main class="box"><div class="robot">🤖</div><h1>RUSTBOT TRADE AI</h1><p>AI Market Analysis & Trading Signal</p><p id="status">Masukkan alamat Web App Google Apps Script (/exec) untuk membuka dashboard RUSTBOT.</p><label for="url">Alamat Web App (/exec)</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/AKfycbzf0P1NUciMpo1jGW3MO3yu0PV-rspBB-JQp8dykN5Rr1NPBelTCL59I_6fhTyOCHmF/exec" autocomplete="url"><button id="save">Simpan alamat di HP ini</button><a id="open" class="button" href="#" target="_blank" rel="noopener noreferrer">📈 Buka Dashboard Trading</a><small>© Rustam, S.E. • Memerlukan internet. Data dan analisis tetap diproses oleh Google Apps Script.</small></main><script>const input=document.getElementById('url'),open=document.getElementById('open'),status=document.getElementById('status');function valid(v){try{const u=new URL(v);return u.protocol==='https:'&&u.hostname==='script.google.com'&&u.pathname.endsWith('/exec')}catch(e){return false}}function apply(v){if(valid(v)){open.href=v;status.textContent='Alamat Web App siap. Tekan Buka Dashboard Trading.'}else{open.removeAttribute('href');status.textContent='Masukkan URL deployment Google Apps Script yang berakhir /exec.'}}const stored=localStorage.getItem('rustbot_exec')||'';input.value=stored;apply(stored);document.getElementById('save').addEventListener('click',()=>{const v=input.value.trim();if(!valid(v)){apply('');alert('URL harus https://script.google.com/macros/s/.../exec');return}localStorage.setItem('rustbot_exec',v);apply(v)});open.addEventListener('click',e=>{if(!valid(open.href)){e.preventDefault();alert('Simpan URL /exec terlebih dahulu.')}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(console.warn);</script></body></html>
